<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homer — Greek Text Explorer</title>
<style>
  :root { color-scheme: light; }
  body { font-family: Georgia, "Times New Roman", serif; background:#faf9f6; color:#262626; max-width:1450px; margin:40px auto; padding:0 24px; }
  header { border-bottom:1px solid #ccc; margin-bottom:25px; }
  h1 { font-size:38px; font-weight:normal; margin-bottom:5px; }
  .subtitle { color:#777; margin-top:0; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; margin:20px 0; }
  select,input,button { font:16px system-ui,sans-serif; padding:10px; border:1px solid #ccc; border-radius:5px; background:white; }
  input { flex:1; min-width:200px; }
  button { cursor:pointer; }
  button:focus-visible, .result:focus-visible { outline:2px solid #245f85; outline-offset:2px; }
  .verse { display:grid; grid-template-columns:50px minmax(0,1fr); gap:15px; padding:5px 0; font-size:21px; line-height:1.6; }
  .verse.parallel {grid-template-columns:50px minmax(0,1fr);gap:8px;border-bottom:1px solid #eee9df;padding:9px 0;}
  .verse.parallel .number {grid-row:1 / 3;}
  .verse.parallel .greek {grid-column:2;grid-row:1;}
  .verse.parallel .translation {grid-column:2;grid-row:2;}
  .english-section { margin:6px 0 15px 65px; padding:11px 15px; border-left:3px solid #cec1a7; background:#f5f1e9; font:17px/1.7 Georgia,"Times New Roman",serif; color:#4a4339; max-width:1000px; }
  .english-ref {font:12px system-ui,sans-serif;color:#786a57; margin-bottom:5px;}
  .translation {font-size:17px;line-height:1.7;color:#4a4339;}
  /* Preserve each metrical verse on ONE visual row. Scroll horizontally if needed. */
  .verse.parallel .greek {font-size:21px;}
  .verse.parallel .translation {font-size:18px;padding:0 0 0 10px;}
  .parallel-head {font:13px system-ui,sans-serif;color:#756a5e;margin:16px 0 6px;border-bottom:1px solid #cdc2b4;padding-bottom:8px;}
  .translation-note {font:13px/1.5 system-ui,sans-serif;color:#765c34;background:#f4efe3;padding:10px 13px;border-left:3px solid #ae9973;margin:12px 0;}
  .number { color:#888; font:13px system-ui,sans-serif; padding-top:9px; }
  .greek { user-select:text; -webkit-user-select:text; overflow-wrap:anywhere; }
  .greek-word { cursor:pointer; border-radius:3px; }
  .greek-word:hover { background:#ede6d4; }
  .greek-word:focus-visible { outline:2px solid #245f85; }
  .reference { color:#777; font:13px system-ui,sans-serif; }
  .result { border-bottom:1px solid #eee; padding:12px 0; cursor:pointer; }
  .result:hover { background:#f0ede7; }
  .result-text { font-size:20px; line-height:1.7; margin-top:5px; }
  #content { margin-top:25px; }
  #hint { font:13px system-ui,sans-serif; color:#777; }
  #selectionMenu { position:fixed; z-index:50; width:min(295px,calc(100vw - 24px)); background:white; border:1px solid #cfc7b8; border-radius:9px; box-shadow:0 10px 35px #0002; padding:12px; font:14px system-ui,sans-serif; }
  #selectionMenu[hidden] { display:none; }
  #selectionText { display:block; font:20px Georgia,"Times New Roman",serif; color:#252525; padding:5px 2px 12px; overflow-wrap:anywhere; max-height:100px; overflow:auto; }
  #selectionMenu button { width:100%; text-align:left; border:0; border-radius:5px; padding:10px; }
  #selectionMenu button:hover { background:#eeeae2; }
  #selectionMenu button + button { margin-top:3px; }
  #selectionMenu .menuHeader { color:#777; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  #selectionMenu .close { float:right; width:auto; padding:2px 7px; font-size:18px; }
  #toTop {position:fixed;right:22px;bottom:22px;z-index:35;border:1px solid #b7aa94;
    background:#faf9f6;box-shadow:0 3px 15px #0002;font-size:15px;padding:11px 16px;}
  #toTop[hidden] {display:none;}
  #morphInfo {margin:7px 0 9px;padding:9px;background:#f5f1e9;color:#4b4234;font:13px/1.55 system-ui,sans-serif;border-radius:5px;white-space:pre-line;}
  #morphInfo[hidden] {display:none;}
  @media(max-width:700px) {.verse.parallel .greek{font-size:19px}.verse.parallel .translation{font-size:16px}}
  @media(max-width:600px) { body { margin:20px auto; padding:0 14px; } .verse { font-size:19px; } }
</style>
</head>
<body>
  <a href="https://historicalresearch.netlify.app/">
  ← Back to Historical Research
</a>
<header><h1>HOMER</h1><p class="subtitle">Greek Text Explorer · Iliad &amp; Odyssey · 1.9</p></header>
<div class="controls">
  <select id="work" aria-label="Poem"><option value="iliad">Iliad</option><option value="odyssey">Odyssey</option></select>
  <select id="book" aria-label="Book"></select>
  <button id="previous">← Previous</button><button id="next">Next →</button>
</div>
<div class="controls">
  <input id="search" placeholder="Greek, Achilles Hector, or forms Achilles (selected poem)" aria-label="Greek search text">
  <button id="searchButton">Search both poems</button><button id="fuzzySearchButton" title="Find similar verses in both poems">Similar verses</button><button id="clearButton">Clear</button>
</div>
<div class="controls"><label for="translationSelect" style="align-self:center;font:14px system-ui,sans-serif">Translation:</label><select id="translationSelect" aria-label="Translation"><option value="none">Greek only</option><option value="sv" selected>Svenska · Erland Lagerlöf</option><option value="en">English · A. T. Murray</option></select></div>
<p id="translationStatus" class="translation-note" hidden></p>
<p id="hint">Select Iliad or Odyssey, then type Achilles, Achilles Hector, or forms Achilles. Click a Greek noun for classified grammatical forms.</p>
<p id="status" class="reference" role="status"></p>
<main id="content"></main>
<div id="selectionMenu" role="dialog" aria-label="Greek selection search options" hidden>
  <button class="close" id="closeMenu" aria-label="Close search menu">×</button>
  <div class="menuHeader">Selected Greek text</div>
  <span id="selectionText" lang="grc"></span>
  <button id="exactSearch">Search exact spelling · both poems</button>
  <button id="accentSearch">Search without accents · both poems</button>
  <button id="bookSearch">Find in this book</button>
  <button id="fuzzySelection" hidden>Find similar verses · both poems</button>
  <div id="morphInfo" hidden></div>
  <button id="explainWord" hidden>Explain word with ChatGPT · copy question</button>
  <button id="nounForms" hidden>Classify noun forms</button>
  <button id="lemmaSearch" hidden>Find all forms of this lemma</button>
  <div id="lemmaInfo" class="reference" style="padding:4px 9px;line-height:1.5" hidden></div>
  <button id="copySelection">Copy Greek text</button>
</div>
<button id="toTop" hidden aria-label="Back to top">↑ Upp</button>
<script>
'use strict';
let corpus = {};
let iliadLemmas = null;
let iliadEpithets = null;
let odysseyLemmas = null;
let odysseyEpithets = null;
const workLabel = w => w==='iliad'?'Iliad':'Odyssey';
const indexFor = w => w==='iliad'?iliadLemmas:odysseyLemmas;
const epithetsFor = w => w==='iliad'?iliadEpithets:odysseyEpithets;
const activeWork = () => workSelect.value;
let selectedLemmas = [];
let selectedLemmaSequence = [];
let inSearchView=false;
const workSelect = document.getElementById('work');
const bookSelect = document.getElementById('book');
const content = document.getElementById('content');
const status = document.getElementById('status');
const searchInput = document.getElementById('search');
const menu = document.getElementById('selectionMenu');
const selectionText = document.getElementById('selectionText');
let selectedGreek = '';
let selectedSource = null;
let selectedBook = null;
let selectedLine = null;
const translationSelect=document.getElementById('translationSelect');
const translationStatus=document.getElementById('translationStatus');
const translationCache=new Map();
let bookRenderToken=0;
async function loadTranslation(work,book,lang) {
  const key=`${work}/${lang}/${book}`;
  if(translationCache.has(key)) return translationCache.get(key);
  const request=fetch(`data/translations/${work}/${lang}/book-${book}.json`)
    .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();})
    .catch(()=>null);
  translationCache.set(key,request);
  return request;
}


// Accent-free matching is text matching, not lemmatization.
function normalizeGreek(text) {
  return text.toLocaleLowerCase('el').normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/ς/g, 'σ');
}
function exactGreek(text) { return text.normalize('NFC'); }
function sameText(a,b,accentFree) {
  return accentFree ? normalizeGreek(a).includes(normalizeGreek(b)) : exactGreek(a).includes(exactGreek(b));
}
function populateBooks() {
  bookSelect.replaceChildren();
  for (const book of corpus[workSelect.value] || []) bookSelect.add(new Option('Song ' + book.book, book.book));
  showBook();
}
function greekSpan(verse) {
  const text = document.createElement('span');
  text.className='greek'; text.lang='grc'; text.dataset.greekText=verse.text;
  // Preserve the original Greek and punctuation, make words individually clickable.
  const tokens = verse.text.match(/\p{L}[\p{L}\p{M}\u1FBD\u1FBF\u1FFE\u2019\u02BC]*|[^\p{L}]+/gu) || [verse.text];
  for (const token of tokens) {
    if (/\p{L}/u.test(token)) {
      const part=document.createElement('span'); part.className='greek-word';
      part.textContent=token; text.append(part);
    } else text.append(document.createTextNode(token));
  }
  return text;
}
function attachVerseRef(span,work,book,line) {
  span.dataset.work=work; span.dataset.book=book; span.dataset.line=line;
  return span;
}
async function showBook(focusLine = null) {
  inSearchView=false; document.getElementById("toTop").hidden=true;
  closeMenu();
  const token=++bookRenderToken;
  const work=workSelect.value;
  const number=Number(bookSelect.value);
  const book=(corpus[work]||[]).find(b=>b.book===number);
  if(!book) return;
  translationStatus.hidden=true;
  content.replaceChildren();
  status.textContent=`${work==='iliad'?'Iliad':'Odyssey'} · Song ${number} · ${book.verses.length} verses`;
  const language=translationSelect.value;
  let translation=null;
  if(language!=='none') {
    translation=await loadTranslation(work,number,language);
    if(token!==bookRenderToken) return;
    if(!translation) {
      translationStatus.textContent=language==='en'
        ? 'No English Murray translation is installed for this work/book. Greek text is shown alone.'
        : 'No Swedish translation file found for this book. Greek text is shown alone.';
    } else if(language==='sv') {
      translationStatus.textContent='Svenska · Erland Lagerlöf. Verskoppling preliminär. '+
        `Greek: ${book.verses.length} verses · Swedish: ${translation.verses.length} rows.`+
        (translation.verses.length!==book.verses.length?' Counts differ; later rows may not correspond.':' Matching counts do not guarantee exact alignment.');
    } else {
      translationStatus.textContent='English · A. T. Murray. Original prose in source-marked Greek verse intervals; not a word-for-word or line-for-line alignment.';
    }
    translationStatus.hidden=false;
  }
  if(translation) {
    const heading=document.createElement('div');heading.className='parallel-head';
    heading.textContent=language==='sv'
      ? 'Grekiska · Homeros   /   Svenska · Erland Lagerlöf'
      : 'Greek · Homer   /   English prose · A. T. Murray';
    content.append(heading);
  }
  const swedish=language==='sv'&&translation?translation.verses:[];
  const transByNumber=new Map(swedish.map(v=>[Number(v.line),v.text]));
  // Attach English paragraphs after their last corresponding Greek verse.
  const englishByEnd=new Map();
  if(language==='en'&&translation) {
    for(const segment of translation.verses) {
      const end=Number(segment.endLine??segment.line);
      if(!englishByEnd.has(end)) englishByEnd.set(end,[]);
      englishByEnd.get(end).push(segment);
    }
  }
  const fragment=document.createDocumentFragment();
  for(const verse of book.verses) {
    const row=document.createElement('div');
    row.className='verse'+(language==='sv'&&translation?' parallel':'');
    row.id='line-'+verse.line;
    const n=document.createElement('span');n.className='number';n.textContent=verse.line;
    row.append(n,attachVerseRef(greekSpan(verse),work,number,verse.line));
    if(language==='sv'&&translation) {
      const sw=document.createElement('span');sw.className='translation';sw.lang='sv';
      sw.textContent=transByNumber.get(Number(verse.line))||'—';
      row.append(sw);
    }
    fragment.append(row);
    for(const segment of englishByEnd.get(Number(verse.line))||[]) {
      const para=document.createElement('div');para.className='english-section';para.lang='en';
      const ref=document.createElement('div');ref.className='english-ref';
      const first=Number(segment.line),last=Number(segment.endLine??segment.line);
      ref.textContent=`Murray · ${work==='iliad'?'Iliad':'Odyssey'} ${number}.${first}${last!==first?'–'+last:''}`;
      const text=document.createElement('div');text.textContent=segment.text;
      para.append(ref,text);fragment.append(para);
    }
  }
  if(language==='sv'&&translation) {
    const lastGreek=Math.max(...book.verses.map(v=>Number(v.line)));
    for(const sv of swedish.filter(v=>Number(v.line)>lastGreek)) {
      const row=document.createElement('div');row.className='verse parallel';
      const n=document.createElement('span');n.className='number';n.textContent=sv.line;
      const blank=document.createElement('span');blank.className='greek';blank.textContent='—';
      const tr=document.createElement('span');tr.className='translation';tr.lang='sv';tr.textContent=sv.text;
      row.append(n,blank,tr);fragment.append(row);
    }
  }
  content.append(fragment);
  if(focusLine!==null) document.getElementById('line-'+focusLine)?.scrollIntoView({block:'center'});
}

function searchCorpus(rawQuery, {accentFree=true, currentBookOnly=false}={}) {
  inSearchView=true; document.getElementById("toTop").hidden=false;
  ++bookRenderToken; translationStatus.hidden=true;
  closeMenu();
  const query=rawQuery.trim().replace(/\s+/g,' ');
  if (!query) return;
  searchInput.value=query;
  content.replaceChildren();
  let count=0; const maxDisplayed=300;
  const sources=currentBookOnly ? [[workSelect.value,corpus[workSelect.value].filter(b=>b.book===Number(bookSelect.value))]] : Object.entries(corpus);
  for (const [work,books] of sources) for (const book of books) for (const verse of book.verses) {
    if (!sameText(verse.text,query,accentFree)) continue;
    count++;
    if (count>maxDisplayed) continue;
    const row=document.createElement('div'); row.className='result'; row.tabIndex=0;
    const ref=document.createElement('div'); ref.className='reference';
    ref.textContent=`${work==='iliad'?'Iliad':'Odyssey'} ${book.book}.${verse.line}`;
    const text=attachVerseRef(greekSpan(verse),work,book.book,verse.line); text.classList.add('result-text');
    row.append(ref,text);
    const navigate=()=>{workSelect.value=work; populateBooks(); bookSelect.value=String(book.book); showBook(verse.line);};
    row.addEventListener('click', e=>{ if(!e.target.closest('.greek-word')) navigate(); });
    row.addEventListener('keydown', e=>{if(e.key==='Enter') navigate();});
    content.append(row);
  }
  status.textContent=`${count} matching verses`+(currentBookOnly?' in this book':'')+(count>maxDisplayed?` (first ${maxDisplayed} displayed)`:'');
}
// Latin-name input is deliberately limited to known names, not guessed transliteration.
const nameAliases = {
  achilles:'Ἀχιλλεύς',achilleus:'Ἀχιλλεύς',hector:'Ἕκτωρ',hektor:'Ἕκτωρ',
  agamemnon:'Ἀγαμέμνων',zeus:'Ζεύς',hera:'Ἥρα',odysseus:'Ὀδυσσεύς',ulysses:'Ὀδυσσεύς',
  menelaus:'Μενέλαος',athena:'Ἀθήνη',athene:'Ἀθήνη',apollo:'Ἀπόλλων',
  patroclus:'Πάτροκλος',patroklos:'Πάτροκλος',paris:'Ἀλέξανδρος',
  priam:'Πρίαμος',andromache:'Ἀνδρομάχη',diomedes:'Διομήδης',
  aeneas:'Αἰνείας',ajax:'Αἴας',poseidon:'Ποσειδῶν',aphrodite:'Ἀφροδίτη',
  telemachos:'Τηλέμαχος',telemachus:'Τηλέμαχος',telemachos:'Τηλέμαχος',
  penelope:'Πηνελόπεια',
  helena:'Ἑλένη',helen:'Ἑλένη',helene:'Ἑλένη',
  kalypso:'Καλυψώ',calypso:'Καλυψώ',
  kirke:'Κίρκη',circe:'Κίρκη',
  nausikaa:'Ναυσικάα',nausicaa:'Ναυσικάα',
  alkinoos:'Ἀλκίνοος',alcinous:'Ἀλκίνοος',
  polyphemos:'Πολύφημος',polyphemus:'Πολύφημος'
};
function latinNames(query) {
  const parts=query.toLowerCase().trim().split(/[\s,;]+/).filter(Boolean);
  return parts.length && parts.length<=2 && parts.every(p=>nameAliases[p])
    ?parts.map(p=>nameAliases[p]):null;
}
function addEpithetsResult(refs,work=activeWork()) {
  const limit=300;
  let shown=0;
  for(const ref of refs) {
    if(shown++>=limit)break;
    const [bookNo,lineNo]=ref.split('.').map(Number);
    const verse=corpus[work]?.find(b=>b.book===bookNo)?.verses.find(v=>Number(v.line)===lineNo);
    if(!verse)continue;
    const row=document.createElement('div');row.className='result';row.tabIndex=0;
    const label=document.createElement('div');label.className='reference';label.textContent=workLabel(work)+' '+ref;
    const greek=attachVerseRef(greekSpan(verse),work,bookNo,lineNo);greek.classList.add('result-text');
    row.append(label,greek);
    const navigate=()=>{workSelect.value=work;populateBooks();bookSelect.value=String(bookNo);showBook(lineNo);};
    row.addEventListener('click',e=>{if(!e.target.closest('.greek-word'))navigate();});
    row.addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});
    content.append(row);
  }
}
function compareEpithets(first,second,work=activeWork()) {
  inSearchView=true;document.getElementById('toTop').hidden=false;
  ++bookRenderToken;translationStatus.hidden=true;closeMenu();content.replaceChildren();
  const index=epithetsFor(work);
  if(!index) {status.textContent=workLabel(work)+' epithet index unavailable. Generate it from the '+workLabel(work)+' treebank.';return;}
  const left=index[first]||{},right=index[second]||{};
  const shared=Object.keys(left).filter(e=>right[e]).sort((a,b)=>(right[b].length+left[b].length)-(right[a].length+left[a].length));
  status.textContent=`${shared.length} shared annotated adjective lemmas · ${first} / ${second} · ${workLabel(work)} treebank`;
  if(!shared.length){content.textContent='No shared adjective dependencies in the available annotations.';return;}
  const explanation=document.createElement('p');explanation.className='reference';
  explanation.textContent='Counts are annotated verses with a direct adjective–name dependency, not a complete literary classification of epithets. Click a count to inspect the Greek verses.';
  content.append(explanation);
  const table=document.createElement('table');table.style.cssText='border-collapse:collapse;width:100%;max-width:760px;font:16px system-ui,sans-serif';
  const head=document.createElement('tr');
  for(const name of ['Adjective lemma',first,second]){const cell=document.createElement('th');cell.textContent=name;cell.style.cssText='padding:10px;text-align:left;border-bottom:1px solid #ccc';head.append(cell);}table.append(head);
  for(const epithet of shared){
    const row=document.createElement('tr');const word=document.createElement('td');word.textContent=epithet;word.lang='grc';word.style.cssText='padding:9px;border-bottom:1px solid #eee';row.append(word);
    for(const data of [left,right]){
      const cell=document.createElement('td');cell.style.cssText='padding:9px;border-bottom:1px solid #eee';
      const button=document.createElement('button');button.textContent=String(data[epithet].length);button.title='Show matching Greek verses';
      button.style.cssText='padding:4px 12px';
      button.onclick=()=>{content.replaceChildren();status.textContent=`${data[epithet].length} annotated ${workLabel(work)} verses · ${epithet} + ${data===left?first:second}`;
        const back=document.createElement('button');back.textContent='← Back to comparison';back.onclick=()=>compareEpithets(first,second,work);content.append(back);
        addEpithetsResult(data[epithet],work);};
      cell.append(button);row.append(cell);
    }table.append(row);
  }content.append(table);
}
function searchFromInput(){
  const query=searchInput.value.trim();const names=latinNames(query);
  const formQuery=query.match(/^(?:forms|declension|grammatical forms)\s+(.+)$/i);
  if(formQuery){const requested=latinNames(formQuery[1]);if(requested?.length===1){classifyNounForms(requested);return;}const lemma=formQuery[1].trim();classifyNounForms([lemma]);return;}
  if(names?.length===2){compareEpithets(...names);return;}
  if(names?.length===1){if(!indexFor(activeWork())){status.textContent=workLabel(activeWork())+' lemma index unavailable.';return;}searchLemmas(names);return;}
  searchCorpus(query);
}
function closeMenu() { menu.hidden=true; selectedGreek=''; selectedSource=null; selectedLemmas=[]; selectedLemmaSequence=[]; }
function lemmaCandidates(source, spelling) {
  const index=indexFor(source?.dataset.work);
  if(!index) return [];
  const key=source.dataset.book+'.'+source.dataset.line;
  const annotations=index[key] || [];
  const keyForm=normalizeGreek(spelling);
  return [...new Set(annotations.filter(w=>normalizeGreek(w[0])===keyForm && w[1]).map(w=>w[1]))];
}
// Perseus nine-position morphology codes; only fields explicitly present are displayed.
const posNames={n:'Substantiv',v:'Verb',a:'Adjektiv',p:'Pronomen',d:'Adverb',l:'Artikel',r:'Preposition',c:'Konjunktion',g:'Partikel',m:'Räkneord',i:'Interjektion',e:'Utrop',u:'Interpunktion'};
function describeMorph(tag) {
  if(typeof tag!=='string'||tag.length<9)return '';
  const v=tag.split(''); const parts=[posNames[v[0]]||'Ordklass ej angiven'];
  const val=(index,table)=>table[v[index]];
  if(v[0]==='v') {
    const person=val(1,{'1':'1:a person','2':'2:a person','3':'3:e person'});
    const num=val(2,{s:'singularis',p:'pluralis',d:'dualis'});
    const tense=val(3,{p:'presens',i:'imperfekt',f:'futurum',a:'aorist',r:'perfekt',l:'pluskvamperfekt',t:'futurum exaktum'});
    const mood=val(4,{i:'indikativ',s:'konjunktiv',o:'optativ',m:'imperativ',n:'infinitiv',p:'particip'});
    const voice=val(5,{a:'aktiv',m:'medium',p:'passiv',e:'medio-passiv'});
    parts.push(...[person,num,tense,mood,voice].filter(Boolean));
  } else {
    const num=val(2,{s:'singularis',p:'pluralis',d:'dualis'});
    const gender=val(6,{m:'maskulinum',f:'femininum',n:'neutrum'});
    const kase=val(7,{n:'nominativ',g:'genitiv',d:'dativ',a:'ackusativ',v:'vokativ',l:'lokativ'});
    parts.push(...[kase,num,gender].filter(Boolean));
  }
  return parts.join(' · ');
}
function wordAnnotations(source,spelling) {
  const index=indexFor(source?.dataset.work);
  if(!index)return [];
  const words=index[source.dataset.book+'.'+source.dataset.line]||[];
  return words.filter(w=>normalizeGreek(w[0])===normalizeGreek(spelling));
}
function currentExplanationPrompt(){
  const source=selectedSource, work=source?.dataset.work==='odyssey'?'Odysséen':'Iliaden';
  const b=Number(source?.dataset.book), n=Number(source?.dataset.line);
  const verse=(corpus[source?.dataset.work]||[]).find(x=>x.book===b)?.verses.find(x=>x.line===n)?.text||'';
  const forms=wordAnnotations(source,selectedGreek);
  const evidence=forms.length?forms.map(w=>`Lemma: ${w[1]}; Perseus-analys: ${w[2]} (${describeMorph(w[2])})`).join(' / '):'Ingen treebankanalys tillgänglig';
  return `Förklara det homeriska grekiska ordet ${selectedGreek} i ${work} ${b}.${n}.\nGrekisk vers: ${verse}\n${evidence}\nFörklara grundbetydelse, grammatik, användning i versen och eventuellt sammansättning. Skilj belagda uppgifter från tolkning.`;
}
function searchLemmas(lemmas,work=activeWork()) {
  inSearchView=true; document.getElementById("toTop").hidden=false;
  ++bookRenderToken;translationStatus.hidden=true;
  closeMenu();
  const index=indexFor(work);
  if(!index || !lemmas.length) {status.textContent=workLabel(work)+' lemma index unavailable.';return;}
  const keys=new Set(lemmas.map(normalizeGreek));
  content.replaceChildren();
  let count=0, limit=300;
  const matches=Object.entries(index).filter(([ref,words])=>
    words.some(w=>keys.has(normalizeGreek(w[1] || ''))));
  for(const [ref,words] of matches) {
    count++;
    if(count>limit) continue;
    const [bookNo,lineNo]=ref.split('.').map(Number);
    const book=corpus[work]?.find(b=>b.book===bookNo);
    const verse=book?.verses.find(v=>v.line===lineNo);
    if(!verse) continue;
    const row=document.createElement('div'); row.className='result'; row.tabIndex=0;
    const label=document.createElement('div'); label.className='reference'; label.textContent=workLabel(work)+' '+ref;
    const greek=attachVerseRef(greekSpan(verse),work,bookNo,lineNo);
    greek.classList.add('result-text');
    row.append(label,greek);
    const navigate=()=>{workSelect.value=work; populateBooks();bookSelect.value=String(bookNo);showBook(lineNo);};
    row.addEventListener('click',e=>{if(!e.target.closest('.greek-word'))navigate();});
    row.addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});
    content.append(row);
  }
  status.textContent=`${count} ${workLabel(work)} verses annotated with lemma ${lemmas.join(' / ')}`+
    (count>limit?` (first ${limit} displayed)`:'');
  searchInput.value=lemmas.join(' / ');
}

// Group attested noun forms by Perseus case, number and gender. No paradigms are invented.
function classifyNounForms(lemmas,work=activeWork()) {
  inSearchView=true;document.getElementById('toTop').hidden=false;
  ++bookRenderToken;translationStatus.hidden=true;closeMenu();content.replaceChildren();
  const index=indexFor(work);
  if(!index){status.textContent=workLabel(work)+' morphology index unavailable.';return;}
  const wanted=new Set(lemmas.map(normalizeGreek));
  const groups=new Map();let occurrences=0;
  for(const [ref,words] of Object.entries(index)){
    for(const w of words){
      if(!wanted.has(normalizeGreek(w[1]||'')))continue;
      const tag=w[2]||'';
      if(tag.length<9||tag[0]!=='n')continue;
      const number=tag[2],gender=tag[6],kase=tag[7];
      const key=[kase,number,gender,normalizeGreek(w[0])].join('|');
      if(!groups.has(key))groups.set(key,{kase,number,gender,form:w[0],refs:[],count:0});
      const group=groups.get(key);group.count++;group.refs.push(ref);occurrences++;
    }
  }
  const cases={n:'Nominative',g:'Genitive',d:'Dative',a:'Accusative',v:'Vocative',l:'Locative'};
  const numbers={s:'Singular',p:'Plural',d:'Dual'};
  const genders={m:'Masculine',f:'Feminine',n:'Neuter'};
  const caseOrder='ngdavl',numberOrder='spd';
  const rows=[...groups.values()].sort((a,b)=>caseOrder.indexOf(a.kase)-caseOrder.indexOf(b.kase)||numberOrder.indexOf(a.number)-numberOrder.indexOf(b.number)||a.form.localeCompare(b.form,'el'));
  status.textContent=`${occurrences} annotated noun occurrences · ${rows.length} attested form/class combinations · ${lemmas.join(' / ')} · ${workLabel(work)}`;
  if(!rows.length){content.textContent=`No noun forms found for this lemma in the available ${workLabel(work)} annotations.`;return;}
  const note=document.createElement('p');note.className='reference';note.textContent=`Only attested forms in the annotated ${workLabel(work)} are shown. A dash means the morphological feature was not specified. Click a count to see its verses.`;content.append(note);
  const table=document.createElement('table');table.style.cssText='border-collapse:collapse;width:100%;max-width:850px;font:15px system-ui,sans-serif';
  const head=document.createElement('tr');for(const title of ['Case','Number','Gender','Greek form','Occurrences']){const th=document.createElement('th');th.textContent=title;th.style.cssText='text-align:left;padding:8px;border-bottom:1px solid #aaa';head.append(th);}table.append(head);
  for(const item of rows){
    const tr=document.createElement('tr');
    for(const value of [cases[item.kase]||'—',numbers[item.number]||'—',genders[item.gender]||'—',item.form]){const td=document.createElement('td');td.textContent=value;td.style.cssText='padding:8px;border-bottom:1px solid #ddd';if(value===item.form)td.lang='grc';tr.append(td);}
    const td=document.createElement('td');td.style.cssText='padding:8px;border-bottom:1px solid #ddd';const btn=document.createElement('button');btn.textContent=String(item.count);btn.title='Show attested verses';btn.onclick=()=>{
      content.replaceChildren();status.textContent=`${item.count} annotated occurrences · ${item.form} · ${cases[item.kase]||'Unspecified case'}`;
      const back=document.createElement('button');back.textContent='← Back to grammatical forms';back.onclick=()=>classifyNounForms(lemmas,work);content.append(back);
      addEpithetsResult([...new Set(item.refs)],work);
    };td.append(btn);tr.append(td);table.append(tr);
  }
  content.append(table);
}

// Resolve a selected phrase to an ordered sequence of annotated lemmata.
// Compact indexes for both poems store tokens in verse order, but no dependency heads.
function phraseLemmas(source, phrase) {
  const index=indexFor(source?.dataset.work);
  if(!index) return [];
  const words=index[source.dataset.book+'.'+source.dataset.line]||[];
  const tokens=(phrase.match(/\p{L}[\p{L}\p{M}\u1FBD\u1FBF\u1FFE\u2019\u02BC]*/gu)||[]).map(normalizeGreek);
  if(tokens.length<2) return [];
  for(let start=0;start<=words.length-tokens.length;start++) {
    if(tokens.every((token,i)=>normalizeGreek(words[start+i][0])===token) &&
       words.slice(start,start+tokens.length).every(w=>w[1])) {
      return words.slice(start,start+tokens.length).map(w=>w[1]);
    }
  }
  return [];
}
function searchLemmaSequence(lemmas,work=activeWork()) {
  const index=indexFor(work);
  if(!index || lemmas.length<2) {status.textContent=workLabel(work)+' lemma index unavailable.';return;}
  inSearchView=true;document.getElementById('toTop').hidden=false;
  ++bookRenderToken;translationStatus.hidden=true;
  closeMenu();content.replaceChildren();
  const wanted=lemmas.map(normalizeGreek);
  let count=0;const limit=300;
  for(const [ref,words] of Object.entries(index)) {
    let matched=false;
    for(let i=0;i<=words.length-wanted.length;i++) {
      if(wanted.every((lemma,j)=>normalizeGreek(words[i+j][1]||'')===lemma)) {matched=true;break;}
    }
    if(!matched)continue;
    const [bookNo,lineNo]=ref.split('.').map(Number);
    const verse=corpus[work]?.find(b=>b.book===bookNo)?.verses.find(v=>Number(v.line)===lineNo);
    if(!verse)continue;
    count++;
    if(count>limit)continue;
    const row=document.createElement('div');row.className='result';row.tabIndex=0;
    const label=document.createElement('div');label.className='reference';label.textContent=workLabel(work)+' '+ref;
    const greek=attachVerseRef(greekSpan(verse),work,bookNo,lineNo);
    greek.classList.add('result-text');row.append(label,greek);
    const navigate=()=>{workSelect.value=work;populateBooks();bookSelect.value=String(bookNo);showBook(lineNo);};
    row.addEventListener('click',e=>{if(!e.target.closest('.greek-word'))navigate();});
    row.addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});
    content.append(row);
  }
  status.textContent=`${count} ${workLabel(work)} verses matching lemma sequence ${lemmas.join(' + ')}`+
    (count>limit?` (first ${limit} displayed)`:'');
  searchInput.value=lemmas.join(' + ');
}
// Fuzzy formula search. Matches shared lemma order, allowing insertions,
// omissions and substitutions. Annotation coverage is incomplete; use
// normalized Greek surface forms where a lemma is missing.
function fuzzyTokens(text) {
  return (text.match(/\p{L}[\p{L}\p{M}\u1FBD\u1FBF\u1FFE\u2019\u02BC]*/gu)||[])
    .map(normalizeGreek).filter(Boolean);
}
function fuzzyVerseTokens(work,book,line,text) {
  const annotations=indexFor(work)?.[`${book}.${line}`];
  const surface=fuzzyTokens(text);
  if(!annotations?.length) return surface;
  // Annotations may omit words or split tokens differently. Never align
  // different-length arrays positionally: that would invent word identities.
  const annotated=annotations.map(a=>normalizeGreek(a[1]||a[0]||'')).filter(Boolean);
  return annotated.length===surface.length ? annotated : surface;
}
function fuzzySimilarity(a,b) {
  if(!a.length||!b.length)return {score:0,shared:0};
  // Longest common subsequence preserves order but permits gaps.
  let previous=new Uint16Array(b.length+1);
  for(const token of a){
    const current=new Uint16Array(b.length+1);
    for(let j=1;j<=b.length;j++) current[j]=token===b[j-1]
      ?previous[j-1]+1:Math.max(previous[j],current[j-1]);
    previous=current;
  }
  const shared=previous[b.length];
  return {shared,score:2*shared/(a.length+b.length),coverage:shared/a.length};
}
function searchSimilarVerses(text,source=null) {
  const query=text.trim();if(!query)return;
  if(!Object.keys(corpus).length){status.textContent='Greek corpus is not loaded yet.';return;}
  let work=source?.dataset.work,book=Number(source?.dataset.book),line=Number(source?.dataset.line);
  let sourceVerse=work&&book&&line?corpus[work]?.find(b=>b.book===book)?.verses.find(v=>v.line===line):null;
  // An entered whole verse should use the same lemma representation as
  // candidate verses. Otherwise surface forms are compared against lemmata.
  if(!sourceVerse){
    const normalizedQuery=fuzzyTokens(query).join(' ');
    outer:for(const [poem,books] of Object.entries(corpus))for(const song of books)for(const verse of song.verses){
      if(fuzzyTokens(verse.text).join(' ')===normalizedQuery){
        work=poem;book=song.book;line=verse.line;sourceVerse=verse;break outer;
      }
    }
  }
  // Compare BOTH surface forms and lemmata. Treebank coverage differs
  // between verses; a lemma-only comparison can hide literal repetitions.
  const querySurface=fuzzyTokens(sourceVerse?.text||query);
  const queryLemmas=sourceVerse?fuzzyVerseTokens(work,book,line,sourceVerse.text):querySurface;
  if(querySurface.length<3){status.textContent='Select or enter at least three Greek words.';return;}
  const matches=[];
  for(const [poem,books] of Object.entries(corpus))for(const song of books)for(const verse of song.verses){
    const surface=fuzzyTokens(verse.text);
    const lemmas=fuzzyVerseTokens(poem,song.book,verse.line,verse.text);
    const bySurface=fuzzySimilarity(querySurface,surface);
    const byLemma=fuzzySimilarity(queryLemmas,lemmas);
    const shortQuery=querySurface.length<=6;
    const similarity=shortQuery
      ? (bySurface.coverage>=byLemma.coverage?bySurface:byLemma)
      : (bySurface.score>=byLemma.score?bySurface:byLemma);
    if(similarity.shared>=3 && (shortQuery?similarity.coverage>=0.75:similarity.score>=0.50))
      matches.push({poem,book:song.book,verse, ...similarity});
  }
  matches.sort((a,b)=>(querySurface.length<=6?b.coverage-a.coverage: b.score-a.score)||b.shared-a.shared||a.poem.localeCompare(b.poem)||a.book-b.book||a.verse.line-b.verse.line);
  inSearchView=true;document.getElementById('toTop').hidden=false;
  ++bookRenderToken;translationStatus.hidden=true;closeMenu();content.replaceChildren();
  const limit=150;
  status.textContent=`${matches.length} similar verses · both poems · ${querySurface.length} query words`+
    (matches.length>limit?` (first ${limit} displayed)`:'');
  const note=document.createElement('p');note.className='reference';
  note.textContent=querySurface.length<=6?'Short phrase: at least 3 matching words and 75% of the query, in order (gaps allowed).':'Whole verse: at least 3 matching words and 50% similarity (gaps allowed).';
  content.append(note);
  for(const hit of matches.slice(0,limit)){
    const row=document.createElement('div');row.className='result';row.tabIndex=0;
    const label=document.createElement('div');label.className='reference';
    label.textContent=`${workLabel(hit.poem)} ${hit.book}.${hit.verse.line} · ${Math.round((querySurface.length<=6?hit.coverage:hit.score)*100)}% · ${hit.shared} shared`;
    const greek=attachVerseRef(greekSpan(hit.verse),hit.poem,hit.book,hit.verse.line);
    greek.classList.add('result-text');row.append(label,greek);
    const navigate=()=>{workSelect.value=hit.poem;populateBooks();bookSelect.value=String(hit.book);showBook(hit.verse.line);};
    row.addEventListener('click',e=>{if(!e.target.closest('.greek-word'))navigate();});
    row.addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});
    content.append(row);
  }
}
function openMenu(text, rect, source) {
  const clean=text.trim().replace(/\s+/g,' ');
  if(!clean || !/[\p{Script=Greek}]/u.test(clean)) return;
  selectedGreek=clean; selectedSource=source;
  const isWord=source?.dataset.singleWord==='true';
  selectedLemmas=isWord ? lemmaCandidates(source,clean) : [];
  selectedLemmaSequence=isWord ? [] : phraseLemmas(source,clean);
  const morphInfo=document.getElementById('morphInfo');
  const explain=document.getElementById('explainWord');
  const forms=isWord?wordAnnotations(source,clean):[];
  morphInfo.hidden=forms.length===0;
  morphInfo.textContent=forms.map(w=>`Lemma: ${w[1]}\n${describeMorph(w[2])}\nTreebank relation: ${w[3]||'—'}`).join('\n\n');
  explain.hidden=!isWord;
  const nounButton=document.getElementById('nounForms');
  nounButton.hidden=!forms.some(w=>w[2]?.[0]==='n' && w[1]);
  const lemmaButton=document.getElementById('lemmaSearch');
  const lemmaInfo=document.getElementById('lemmaInfo');
  lemmaButton.hidden=selectedLemmas.length===0 && selectedLemmaSequence.length===0;
  lemmaInfo.hidden=lemmaButton.hidden;
  if(selectedLemmas.length) {
    lemmaButton.textContent='Find all forms of '+selectedLemmas.join(' / ')+' · '+workLabel(source.dataset.work);
    lemmaInfo.textContent='Treebank lemma: '+selectedLemmas.join(' / ')+
      ' (some verses and variant spellings may be unannotated).';
  }
  if(selectedLemmaSequence.length) {
    lemmaButton.textContent='Find all grammatical forms · '+workLabel(source.dataset.work);
    lemmaInfo.textContent='Lemma sequence: '+selectedLemmaSequence.join(' + ')+
      ' (adjacent words in the same order; annotated verses only).';
  }
  document.getElementById('fuzzySelection').hidden=isWord;
  selectionText.textContent=clean;
  document.getElementById('bookSearch').textContent=`Find in ${source?.dataset.work==='iliad'?'Iliad':'Odyssey'} Song ${source?.dataset.book||bookSelect.value}`;
  menu.hidden=false;
  const width=menu.getBoundingClientRect().width;
  menu.style.left=Math.max(12,Math.min(rect.left,innerWidth-width-12))+'px';
  const height=menu.getBoundingClientRect().height;
  const below=rect.bottom+8;
  menu.style.top=(below+height<innerHeight ? below : Math.max(12,rect.top-height-8))+'px';
}
function showSelectionOrWord(event) {
  if(menu.contains(event.target)) return;
  const greek=event.target.closest?.('.greek');
  const selection=window.getSelection();
  if(greek && selection && !selection.isCollapsed && selection.toString().trim()) {
    const range=selection.getRangeAt(0);
    // Accept only selections contained in a Greek verse, not UI or result labels.
    if(greek.contains(range.commonAncestorContainer)) {
      greek.dataset.singleWord='false';
      openMenu(selection.toString(),range.getBoundingClientRect(),greek);
      return;
    }
  }
  if(event.type==='click' && event.target.classList?.contains('greek-word')) {
    const word=event.target;
    greek.dataset.singleWord='true';
    openMenu(word.textContent,word.getBoundingClientRect(),greek);
    event.stopPropagation();
    return;
  }
  if(!menu.hidden) closeMenu();
}
content.addEventListener('mouseup',e=>{
  if(window.getSelection()?.toString().trim()) showSelectionOrWord(e);
});
content.addEventListener('click',showSelectionOrWord);
content.addEventListener('touchend',e=>{
  // Mobile long-press selection: give native handles time to settle.
  if(window.getSelection()?.toString().trim()) showSelectionOrWord(e);
});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!content.contains(e.target)) closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.getElementById('closeMenu').onclick=closeMenu;
document.getElementById('exactSearch').onclick=()=>searchCorpus(selectedGreek,{accentFree:false});
document.getElementById('accentSearch').onclick=()=>searchCorpus(selectedGreek,{accentFree:true});
document.getElementById('bookSearch').onclick=()=>searchCorpus(selectedGreek,{accentFree:true,currentBookOnly:true});
document.getElementById('fuzzySelection').onclick=()=>searchSimilarVerses(selectedGreek,selectedSource);
document.getElementById('nounForms').onclick=()=>classifyNounForms([...selectedLemmas],selectedSource?.dataset.work||activeWork());
document.getElementById('lemmaSearch').onclick=()=>{
  if(selectedLemmaSequence.length)searchLemmaSequence([...selectedLemmaSequence],selectedSource?.dataset.work||activeWork());
  else searchLemmas([...selectedLemmas],selectedSource?.dataset.work||activeWork());
};
document.getElementById('explainWord').onclick=async()=>{
  const prompt=currentExplanationPrompt();
  try {await navigator.clipboard.writeText(prompt);status.textContent='Question copied. Paste it into your ChatGPT conversation.';}
  catch {status.textContent='Copy unavailable; the question is in the search field for manual copying.';searchInput.value=prompt;searchInput.select();}
  closeMenu();
};
document.getElementById('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('copySelection').onclick=async()=>{
  const text=selectedGreek;
  try { await navigator.clipboard.writeText(text); status.textContent='Copied Greek text: '+text; }
  catch { searchInput.value=text; searchInput.select(); status.textContent='Greek copied to search field; use ⌘C to copy.'; }
  closeMenu();
};
workSelect.onchange=populateBooks;
translationSelect.onchange=()=>showBook();
bookSelect.onchange=()=>showBook();
document.getElementById('searchButton').onclick=searchFromInput;
document.getElementById('fuzzySearchButton').onclick=()=>searchSimilarVerses(searchInput.value);
document.getElementById('clearButton').onclick=()=>{searchInput.value='';showBook();};
searchInput.onkeydown=e=>{if(e.key==='Enter')searchFromInput();};
document.getElementById('previous').onclick=()=>{if(bookSelect.selectedIndex>0){bookSelect.selectedIndex--;showBook();}};
document.getElementById('next').onclick=()=>{if(bookSelect.selectedIndex<bookSelect.options.length-1){bookSelect.selectedIndex++;showBook();}};
fetch('data/homer.json')
  .then(response=>{if(!response.ok)throw Error('HTTP '+response.status);return response.json();})
  .then(data=>{
    // Convert the public Poem → Song → Verse schema to the existing
    // in-memory shape used by search, annotation and translation functions.
    corpus=Object.fromEntries(Object.entries(data.poems).map(([poem,entry])=>[
      poem,entry.songs.map(song=>({
        book:Number(song.song),
        verses:song.verses.map(verse=>({line:Number(verse.verse),text:verse.text}))
      }))
    ]));
    populateBooks();
  })
  .catch(error=>{status.textContent='Could not load Homer corpus: '+error.message;});
// One loader for both poems and both annotation types.
async function loadAnnotation(work,kind) {
  const url=`data/${work}_${kind}.json`;
  try {
    const response=await fetch(url);
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json();
    if(kind==='lemmas') {
      if(work==='iliad')iliadLemmas=data;else odysseyLemmas=data;
    } else {
      if(work==='iliad')iliadEpithets=data;else odysseyEpithets=data;
    }
  } catch(error) {console.warn(`${work} ${kind} unavailable:`,error);}
}
for(const work of ['iliad','odyssey'])
  for(const kind of ['lemmas','epithets'])loadAnnotation(work,kind);
